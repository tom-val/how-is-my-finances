name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20"
  # Expo SDK 58 / eas-cli need Node 22+.
  APP_NODE_VERSION: "22"
  TERRAFORM_DIR: infra/environments/dev

permissions:
  contents: read
  id-token: write

jobs:
  # --- Infrastructure (always runs first) ---
  infra:
    runs-on: ubuntu-latest
    environment: Prod
    defaults:
      run:
        working-directory: infra/environments/dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_VAR_supabase_organization_id: ${{ secrets.SUPABASE_ORGANIZATION_ID }}
      TF_VAR_supabase_database_password: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
      TF_VAR_enable_banking_application_id: ${{ secrets.ENABLE_BANKING_APPLICATION_ID }}
      TF_VAR_enable_banking_private_key_b64: ${{ secrets.ENABLE_BANKING_PRIVATE_KEY_B64 }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
    outputs:
      lambda_function_name: ${{ steps.tf.outputs.lambda_function_name }}
      authorizer_function_name: ${{ steps.tf.outputs.authorizer_function_name }}
      ai_processor_function_name: ${{ steps.tf.outputs.ai_processor_function_name }}
      s3_frontend_bucket: ${{ steps.tf.outputs.s3_frontend_bucket }}
      cloudfront_distribution_id: ${{ steps.tf.outputs.cloudfront_distribution_id }}
      api_endpoint: ${{ steps.tf.outputs.api_endpoint }}
      supabase_url: ${{ steps.tf.outputs.supabase_url }}
      supabase_anon_key: ${{ steps.tf.outputs.supabase_anon_key }}
      supabase_project_ref: ${{ steps.tf.outputs.supabase_project_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create dummy Lambda packages
        run: |
          echo "placeholder" | zip dummy.zip -
          echo "placeholder" | zip dummy-authorizer.zip -

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Read Terraform outputs
        id: tf
        run: |
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> "$GITHUB_OUTPUT"
          echo "authorizer_function_name=$(terraform output -raw authorizer_function_name)" >> "$GITHUB_OUTPUT"
          echo "ai_processor_function_name=$(terraform output -raw ai_processor_function_name)" >> "$GITHUB_OUTPUT"
          echo "s3_frontend_bucket=$(terraform output -raw s3_frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> "$GITHUB_OUTPUT"
          echo "supabase_url=$(terraform output -raw supabase_url)" >> "$GITHUB_OUTPUT"
          echo "supabase_anon_key=$(terraform output -raw supabase_anon_key | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "supabase_project_ref=$(terraform output -raw supabase_project_ref)" >> "$GITHUB_OUTPUT"

      - name: Validate critical outputs
        run: |
          failed=false
          for output in lambda_function_name ai_processor_function_name s3_frontend_bucket cloudfront_distribution_id api_endpoint supabase_url supabase_anon_key supabase_project_ref; do
            value=$(terraform output -raw "$output" 2>/dev/null || true)
            if [ -z "$value" ]; then
              echo "::error::Terraform output '$output' is empty"
              failed=true
            fi
          done
          if [ "$failed" = true ]; then
            exit 1
          fi

  # --- Database Migrations (after infra) ---
  migrations:
    needs: infra
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ needs.infra.outputs.supabase_project_ref }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # --- Backend (after infra + migrations) ---
  backend:
    needs: [infra, migrations]
    runs-on: ubuntu-latest
    environment: Prod
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish
        working-directory: backend/src/HowAreMyFinances.Api
        run: dotnet publish -c Release -o ./publish

      - name: Package Lambda
        working-directory: backend/src/HowAreMyFinances.Api/publish
        run: zip -r ../deployment.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ needs.infra.outputs.lambda_function_name }} \
            --zip-file fileb://src/HowAreMyFinances.Api/deployment.zip

      - name: Wait for function update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ needs.infra.outputs.lambda_function_name }}

  # --- Authorizer (after infra, parallel with frontend) ---
  authorizer:
    needs: infra
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/src/authorizer/package-lock.json

      - name: Install dependencies
        working-directory: backend/src/authorizer
        run: npm ci

      - name: Package authorizer
        working-directory: backend/src/authorizer
        run: zip -r deployment.zip index.mjs node_modules/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy authorizer
        run: |
          aws lambda update-function-code \
            --function-name ${{ needs.infra.outputs.authorizer_function_name }} \
            --zip-file fileb://backend/src/authorizer/deployment.zip

  # --- AI processor (after infra + migrations): Node.js Lambda consuming the ai-jobs SQS queue ---
  ai-processor:
    needs: [infra, migrations]
    runs-on: ubuntu-latest
    environment: Prod
    defaults:
      run:
        working-directory: backend/src/ai-processor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/src/ai-processor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Package AI processor
        run: zip -r deployment.zip index.mjs package.json node_modules/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy AI processor
        run: |
          aws lambda update-function-code \
            --function-name ${{ needs.infra.outputs.ai_processor_function_name }} \
            --zip-file fileb://deployment.zip

      - name: Wait for function update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ needs.infra.outputs.ai_processor_function_name }}

  # --- Web app (after infra): Expo web export of app/ -> S3 + CloudFront ---
  web:
    needs: infra
    runs-on: ubuntu-latest
    environment: Prod
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.APP_NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Export web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ needs.infra.outputs.supabase_url }}
          EXPO_PUBLIC_API_URL: ${{ needs.infra.outputs.api_endpoint }}
        run: |
          export EXPO_PUBLIC_SUPABASE_ANON_KEY=$(echo "${{ needs.infra.outputs.supabase_anon_key }}" | base64 -d)
          npm run export:web

      # Hashed bundles are immutable; everything else (index.html, sw.js, favicon) must revalidate so a
      # deploy is visible on the next load.
      - name: Deploy to S3
        run: |
          aws s3 sync dist/_expo s3://${{ needs.infra.outputs.s3_frontend_bucket }}/_expo \
            --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ s3://${{ needs.infra.outputs.s3_frontend_bucket }} \
            --delete --exclude "_expo/*" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.infra.outputs.cloudfront_distribution_id }} \
            --paths "/*"

  # --- EAS environment (after infra) ---
  # Native builds (eas-build.yml) and OTA updates (eas-update.yml) bundle their EXPO_PUBLIC_* values
  # from the EAS "production" environment, not from this repo, so keep it in step with Terraform.
  # Opt-in via the EAS_ENABLED variable (with the EXPO_TOKEN secret). The check sits on each step,
  # not the job: a job-level `if` is evaluated before the job enters the Prod environment, so it
  # can't see variables defined on that environment.
  # OTA updates themselves are deliberately NOT part of deploy; they ship via eas-update.yml.
  eas-env:
    needs: infra
    runs-on: ubuntu-latest
    environment: Prod
    defaults:
      run:
        working-directory: app
    steps:
      - name: EAS disabled (set EAS_ENABLED=true to sync)
        if: vars.EAS_ENABLED != 'true'
        working-directory: .
        run: echo "EAS_ENABLED is not 'true'; skipping the EAS environment sync."

      - uses: actions/checkout@v4
        if: vars.EAS_ENABLED == 'true'

      - uses: actions/setup-node@v4
        if: vars.EAS_ENABLED == 'true'
        with:
          node-version: ${{ env.APP_NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - uses: expo/expo-github-action@v8
        if: vars.EAS_ENABLED == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # eas env:create evaluates the app config (which loads plugins), so deps must be installed.
      # --force overwrites the existing value, which is the point after a redeploy.
      - name: Push EXPO_PUBLIC_* into EAS "production"
        if: vars.EAS_ENABLED == 'true'
        run: |
          npm ci
          ANON_KEY=$(echo "${{ needs.infra.outputs.supabase_anon_key }}" | base64 -d)
          set_var() {
            eas env:create --scope project --environment production \
              --name "$1" --value "$2" \
              --visibility plaintext --type string --force --non-interactive
          }
          set_var EXPO_PUBLIC_SUPABASE_URL "${{ needs.infra.outputs.supabase_url }}"
          set_var EXPO_PUBLIC_SUPABASE_ANON_KEY "$ANON_KEY"
          set_var EXPO_PUBLIC_API_URL "${{ needs.infra.outputs.api_endpoint }}"
